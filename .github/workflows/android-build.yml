name: Build Android AAB

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_REVENUECAT_IOS_API_KEY: ${{ secrets.VITE_REVENUECAT_IOS_API_KEY }}
          VITE_REVENUECAT_ANDROID_API_KEY: ${{ secrets.VITE_REVENUECAT_ANDROID_API_KEY }}
          VITE_MAP_TILES_API_KEY: ${{ secrets.VITE_MAP_TILES_API_KEY }}
          VITE_FORCE_PREMIUM_FOR_TESTING: ${{ vars.FORCE_PREMIUM_FOR_TESTING }}

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      # android-actions/setup-android@v3 unconditionally tries to install the
      # legacy "tools" SDK package, which Google has fully removed from the
      # remote repository — that step now fails outright (confirmed via
      # --stacktrace-equivalent full log, 2026-09-17), unrelated to anything
      # in this app. ubuntu-latest runners already ship a working Android
      # SDK (cmdline-tools + ANDROID_HOME preconfigured) — this just
      # installs the two components this project's compileSdk/targetSdk
      # (36, see android/variables.gradle) actually need, via that
      # preinstalled sdkmanager directly, skipping the broken action.
      - name: Install Android SDK components
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "platform-tools"
          # Exact build-tools version isn't pinned here — AGP resolves and
          # auto-downloads whichever build-tools it needs at build time
          # (licenses are already accepted above), so guessing a specific
          # version string here would just risk recreating the same
          # "package not found" failure this step exists to avoid.

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Decode release keystore
        working-directory: android/app
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.jks

      - name: Build signed release AAB
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace
        env:
          ANDROID_KEYSTORE_PATH: release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Remove decoded keystore
        if: always()
        run: rm -f android/app/release.jks

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: mybodyweight-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
